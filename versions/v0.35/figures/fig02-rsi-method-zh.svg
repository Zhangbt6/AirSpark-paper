<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1080" viewBox="0 0 1640 1080" role="img" aria-labelledby="title desc">
<title id="title">执行与学习反馈驱动的策略自进化</title>
<desc id="desc">六步主循环不变。第1和2步构成当前策略诊断，第6步包含配对评测与固定接纳决策。各用途复用学院执行与评测工具；学习反馈和整次干预记录进入记忆。</desc>
<defs>
<marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#183255"/></marker>
<marker id="arrow-exec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f75"/></marker>
<marker id="arrow-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7552a5"/></marker>
</defs><rect width="1640" height="1080" fill="white"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#183255">
<text x="45" y="45" font-size="31" font-weight="700" fill="#183255" text-anchor="start">执行与学习反馈驱动的策略自进化</text>
<text x="45" y="84" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">六步学习循环；诊断与更新验证复用执行、记录和计分工具</text>
<rect x="25" y="112" width="770" height="308" rx="10" fill="#f7fafc" stroke="#c9d5e2" stroke-width="1.3"/>
<text x="45" y="145" font-size="23" font-weight="600" fill="#087f75" text-anchor="start">当前策略诊断 · 采集池 C</text>
<rect x="45" y="165" width="335" height="235" rx="7" fill="#eef4fd" stroke="#c9d5e2" stroke-width="1.8"/>
<text x="64" y="208" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">1</text>
<text x="96" y="208" font-size="27" font-weight="650" fill="#183255" text-anchor="start">诊断任务执行</text>
<text x="66" y="284" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">采集池 C：学生策略 π<tspan baseline-shift="sub" font-size="75%">θᵣ</tspan></text>
<text x="66" y="319" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">观测历史与动作命令</text>
<text x="66" y="354" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">实际运动与任务结果</text>
<rect x="440" y="165" width="335" height="235" rx="7" fill="white" stroke="#c9d5e2" stroke-width="1.8"/>
<text x="459" y="208" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">2</text>
<text x="491" y="208" font-size="27" font-weight="650" fill="#183255" text-anchor="start">分阶段诊断</text>
<text x="461" y="284" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">阶段到达与转换失败</text>
<text x="461" y="319" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">可观测性、可达性检查</text>
<text x="461" y="354" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">频率、失败率与经验成本</text>
<rect x="845" y="165" width="355" height="235" rx="7" fill="#eaf6f3" stroke="#087f75" stroke-width="1.8"/>
<text x="864" y="208" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">3</text>
<text x="896" y="208" font-size="27" font-weight="650" fill="#183255" text-anchor="start">反馈驱动练习规划</text>
<text x="896" y="239" font-size="27" font-weight="650" fill="#183255" text-anchor="start">SparkMentor</text>
<text x="866" y="284" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">固定分配器计算 bᵣ</text>
<text x="866" y="319" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">选择起点、示范与回放</text>
<text x="866" y="354" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">执行／暂缓／诊断复验</text>
<rect x="845" y="520" width="355" height="235" rx="7" fill="white" stroke="#c9d5e2" stroke-width="1.8"/>
<text x="864" y="563" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">4</text>
<text x="896" y="563" font-size="27" font-weight="650" fill="#183255" text-anchor="start">专家监督生成</text>
<text x="866" y="639" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">合法物理前缀</text>
<text x="866" y="674" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">固定专家执行延续</text>
<text x="866" y="709" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">监督质检与数据导出</text>
<rect x="440" y="520" width="335" height="235" rx="7" fill="#eef4fd" stroke="#c9d5e2" stroke-width="1.8"/>
<text x="459" y="563" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">5</text>
<text x="491" y="563" font-size="27" font-weight="650" fill="#183255" text-anchor="start">学生策略更新</text>
<text x="461" y="639" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">新增数据与接纳回放</text>
<text x="461" y="674" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">固定基础学习算法</text>
<text x="461" y="709" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">按计划训练候选学生</text>
<rect x="45" y="520" width="335" height="235" rx="7" fill="#f4f7fa" stroke="#c9d5e2" stroke-width="1.8"/>
<text x="64" y="563" font-size="25" font-weight="700" fill="#087f75" text-anchor="start">6</text>
<text x="96" y="563" font-size="27" font-weight="650" fill="#183255" text-anchor="start">更新验证与接纳</text>
<text x="66" y="639" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">V：父代／候选配对执行</text>
<text x="66" y="674" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">测量：收益与能力保留</text>
<text x="66" y="709" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">决策：接纳或保留父代</text>
<path d="M380 282 H430" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<path d="M775 282 H835" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-exec)"/>
<text x="805" y="255" font-size="24" font-weight="600" fill="#087f75" text-anchor="middle">Eᵣ</text>
<path d="M1022 400 V510" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="1042" y="459" font-size="20" font-weight="400" fill="#087f75" text-anchor="start">计划 Aᵣ = (bᵣ, η̃ᵣ, dᵣ)</text>
<path d="M845 637 H785" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="810" y="611" font-size="23" font-weight="400" fill="#52657b" text-anchor="middle">Dᵣ</text>
<path d="M440 637 H390" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="412" y="611" font-size="24" font-weight="400" fill="#52657b" text-anchor="middle">θ′</text>
<path d="M212 520 V410" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="230" y="453" font-size="23" font-weight="400" fill="#087f75" text-anchor="start">保留策略</text>
<text x="230" y="486" font-size="24" font-weight="600" fill="#087f75" text-anchor="start">π<tspan baseline-shift="sub" font-size="75%">θᵣ₊₁</tspan></text>
<rect x="1260" y="165" width="335" height="590" rx="7" fill="#f3f0f8" stroke="#7552a5" stroke-width="1.8"/>
<text x="1280" y="208" font-size="27" font-weight="650" fill="#183255" text-anchor="start">跨轮干预记忆</text>
<text x="1280" y="251" font-size="26" font-weight="600" fill="#7552a5" text-anchor="start">Mᵣ = (ℛᵣ, 𝒦ᵣ)</text>
<text x="1280" y="310" font-size="24" font-weight="600" fill="#7552a5" text-anchor="start">ℛ：只追加事实记录</text>
<text x="1280" y="350" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">执行、计划、数据与训练</text>
<text x="1280" y="387" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">评价、版本、成本与决策</text>
<text x="1280" y="422" font-size="22" font-weight="400" fill="#52657b" text-anchor="start">接纳／拒绝／未测量</text>
<text x="1280" y="455" font-size="24" font-weight="600" fill="#7552a5" text-anchor="start">𝒦：可修订教学经验</text>
<text x="1280" y="495" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">解释、建议、条件与反证</text>
<text x="1280" y="532" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">来源、状态与重测条件</text>
<text x="1280" y="617" font-size="23" font-weight="600" fill="#7552a5" text-anchor="start">先记事实，再修订经验</text>
<text x="1280" y="655" font-size="23" font-weight="400" fill="#7552a5" text-anchor="start">成功／拒绝均更新经验</text>
<text x="1280" y="691" font-size="23" font-weight="400" fill="#7552a5" text-anchor="start">按权限供下一轮读取</text>
<path d="M1260 282 H1210" fill="none" stroke="#7552a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-memory)"/>
<text x="1230" y="255" font-size="20" font-weight="400" fill="#7552a5" text-anchor="middle">历史</text>
<path d="M212 755 V815 H1428 V765" fill="none" stroke="#7552a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-memory)"/>
<rect x="340" y="790" width="770" height="45" fill="white"/>
<text x="725" y="821" font-size="24" font-weight="500" fill="#7552a5" text-anchor="middle">学习反馈 Fᵣ ＋ 本轮各阶段记录</text>
<rect x="45" y="855" width="1550" height="94" rx="7" fill="#f6f8fb" stroke="#c9d5e2" stroke-width="1.3"/>
<text x="66" y="890" font-size="22" font-weight="500" fill="#183255" text-anchor="start">共用学院工具：任务执行 → 同步记录 → 任务／阶段计分 → 评价报告</text>
<text x="66" y="925" font-size="22" font-weight="400" fill="#52657b" text-anchor="start">三种用途：C 当前诊断；V 更新验证；T 冻结测试。接纳由固定规则决定。</text>
<text x="45" y="984" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">主路径为一次训练干预；无训练尝试保留学生与配置，记录诊断结果及实际成本</text>
<text x="45" y="1035" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">封存评价位于学习闭环之外：冻结学生 → 原生基准与物理实机；测试反馈不参与修订</text>
</g></svg>
