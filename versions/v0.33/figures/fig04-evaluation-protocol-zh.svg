<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>实验设计与独立验证</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#183255"/></marker></defs><rect width="1440" height="1000" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#183255">
<text x="40" y="45" font-size="32" font-weight="700">实验设计与独立验证</text>
<text x="40" y="94" font-size="25" font-weight="700">基准线：FA-Hexa；ACT、DP、π0.5；柠檬采摘与 Push Slider</text>
