<rect x="740" y="695" width="660" height="200" rx="8" fill="#f1f5fb" stroke="#becddd"/>
<text x="760" y="735" font-size="26" font-weight="700">跨初始化的教学经验复用</text>
<text x="760" y="778" font-size="23" font-weight="400">来源链 i 的冻结经验 → 对应新父代链 i</text>
<text x="760" y="812" font-size="23" font-weight="400">导入经验／空经验；两组都重新训练</text>
<text x="760" y="846" font-size="23" font-weight="400">不导入源权重、训练轨迹或封存信息</text>
<text x="40" y="954" font-size="24" font-weight="400">设施可靠性复用实际日志；表格和曲线待填，不预设学习或迁移效果</text>
</g></svg>