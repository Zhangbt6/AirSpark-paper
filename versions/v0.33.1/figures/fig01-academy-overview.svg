<text x="530" y="239" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Contact, slip and payload changes</text>
<text x="530" y="269" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Explicit collision and movable assets</text>
