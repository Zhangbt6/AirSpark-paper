<text x="996" y="239" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Task definitions and success criteria</text>
<text x="996" y="269" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Real-scene and benchmark alignment</text>
