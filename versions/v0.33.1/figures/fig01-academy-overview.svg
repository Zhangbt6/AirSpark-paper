<text x="64" y="239" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">RGB, depth and semantic observations</text>
<text x="64" y="269" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">3DGS scene appearance</text>
