<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img"><title>From execution evidence to trainable experience</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#183255"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f75"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7552a5"/></marker></defs><rect width="1600" height="960" fill="white"/>
<text x="60" y="66" fill="#183255" font-size="36" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">From execution evidence to trainable experience</text>
<text x="60" y="109" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Method illustration; actual episode frames and learning outcomes will replace schematic panels.</text>
<rect x="60" y="190" width="350" height="250" rx="14" fill="#eef5ff" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="60" y="212" width="5" height="30" fill="#087f75"/>
<text x="84" y="237" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">1  Diagnose a condition</text>
<text x="84" y="278" fill="#55677b" font-size="20" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Stage reach / conditional failures</text>
<text x="84" y="310" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Pose, motion, contact evidence</text>
<text x="84" y="342" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Link policy and episode IDs</text>
<text x="84" y="374" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Use collection-pool records</text>
<rect x="470" y="190" width="350" height="250" rx="14" fill="#eff8f6" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="470" y="212" width="5" height="30" fill="#087f75"/>
<text x="494" y="237" fill="#183255" font-size="24" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">2  Compile a collection plan</text>
<text x="494" y="278" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Condition weights and options</text>
<text x="494" y="310" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Validate expert and resources</text>
<text x="494" y="342" fill="#55677b" font-size="18" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Keep evidence and plan provenance</text>
<text x="494" y="374" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Compile legal collection jobs</text>
<path d="M410 310 L465 310" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#teal)"/>
<path d="M820 310 L875 310" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#teal)"/>
<path d="M850 310 L850 460 L875 460" fill="none" stroke="#087f75" stroke-width="3" marker-end="url(#teal)"/>
<rect x="880" y="190" width="660" height="160" rx="14" fill="#f5f8fc" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="880" y="212" width="5" height="30" fill="#087f75"/>
<text x="904" y="237" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">3a  Condition-specific full demonstrations</text>
<text x="904" y="278" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Execute from a legal reset and record supervision</text>
<text x="904" y="310" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Primary supervision source</text>
<rect x="880" y="380" width="660" height="160" rx="14" fill="#fff7ec" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="880" y="402" width="5" height="30" fill="#b5651d"/>
<text x="904" y="427" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">3b  Optional: physical prefix and expert suffix</text>
<text x="904" y="468" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Validate replay, handover feasibility, and completion</text>
<text x="904" y="500" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Label expert-controlled windows; admit after pilot QA</text>
<rect x="880" y="635" width="660" height="178" rx="14" fill="#f5f8fc" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="880" y="657" width="5" height="30" fill="#087f75"/>
<text x="904" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">4  Qualify data and preserve provenance</text>
<text x="904" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Action targets, chunk boundaries, timing, terminal state</text>
<text x="904" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Count valid supervision windows and all attempts</text>
<text x="904" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Export a traceable training manifest</text>
<path d="M1210 540 L1210 630" fill="none" stroke="#183255" stroke-width="3" marker-end="url(#navy)"/>
<path d="M1540 270 L1564 270 L1564 723 L1545 723" fill="none" stroke="#183255" stroke-width="3" marker-end="url(#navy)"/>
<rect x="470" y="635" width="350" height="178" rx="14" fill="#f5f8fc" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="470" y="657" width="5" height="30" fill="#087f75"/>
<text x="494" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">5  Update the student</text>
<text x="494" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Warm-start parent weights</text>
<text x="494" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Fixed training steps and recipe</text>
<text x="494" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Track replay and data identities</text>
<rect x="60" y="635" width="350" height="178" rx="14" fill="#f5f0fa" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="60" y="657" width="5" height="30" fill="#7552a5"/>
<text x="84" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">6  Validate the intervention</text>
<text x="84" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Paired validation in V</text>
<text x="84" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Produce learning feedback F</text>
<text x="84" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Inform the next round</text>
<path d="M880 724 L825 724" fill="none" stroke="#183255" stroke-width="3" marker-end="url(#navy)"/>
<path d="M470 724 L415 724" fill="none" stroke="#183255" stroke-width="3" marker-end="url(#navy)"/>
<path d="M235 635 L235 530 L645 530 L645 445" fill="none" stroke="#7552a5" stroke-width="3" marker-end="url(#purple)"/>
<text x="294" y="511" fill="#7552a5" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">Revise next practice from measured learning</text>
<text x="60" y="931" fill="#55677b" font-size="18" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">AirSpark  ·  v0.40  ·  Method illustration / 方法示意</text></svg>
