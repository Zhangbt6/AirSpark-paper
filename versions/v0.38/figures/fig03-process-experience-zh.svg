<rect x="470" y="212" width="5" height="30" fill="#087f75"/>
<text x="494" y="237" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">2  编译采集计划</text>
<text x="494" y="278" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">条件比例与采集配置</text>
<text x="494" y="310" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">核查专家与资源</text>
<text x="494" y="342" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">保存证据与决策来源</text>
<text x="494" y="374" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">冻结本轮合法任务</text>
