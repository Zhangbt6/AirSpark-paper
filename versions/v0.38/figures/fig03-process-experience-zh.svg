<rect x="880" y="635" width="660" height="178" rx="14" fill="#f5f8fc" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="880" y="657" width="5" height="30" fill="#087f75"/>
<text x="904" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">4  数据验收与来源记录</text>
<text x="904" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">动作标签、块边界、时序与终态</text>
<text x="904" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">统计有效监督窗口及全部尝试成本</text>
<text x="904" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">输出可追溯的数据清单</text>
