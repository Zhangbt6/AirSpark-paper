<rect x="880" y="402" width="5" height="30" fill="#b5651d"/>
<text x="904" y="427" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">3b  可选：物理前缀与专家后缀</text>
<text x="904" y="468" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">先验证状态重现、接管可行性和完整任务</text>
