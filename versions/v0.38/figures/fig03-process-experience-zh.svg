<rect x="470" y="657" width="5" height="30" fill="#087f75"/>
<text x="494" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">5  更新学生</text>
<text x="494" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">父代权重热启动</text>
<text x="494" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">固定训练规则与步数</text>
<text x="494" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">保留回放与数据身份</text>
<rect x="60" y="635" width="350" height="178" rx="14" fill="#f5f0fa" stroke="#d7e1ec" stroke-width="1.6"/>
<rect x="60" y="657" width="5" height="30" fill="#7552a5"/>
<text x="84" y="682" fill="#183255" font-size="26" font-weight="700" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">6  验证干预效果</text>
<text x="84" y="723" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">V 中父子代配对评价</text>
<text x="84" y="755" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">形成学习反馈 F</text>
<text x="84" y="787" fill="#55677b" font-size="22" font-weight="400" font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">反馈供下一轮计划读取</text>
