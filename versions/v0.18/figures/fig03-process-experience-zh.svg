<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">从执行能力缺口到可训练经验</title><desc id="desc">在学院共享工具上运行的参考练习方法；经验的学习价值由后续实验检验。 本图为研究设计示意，非实测结果。</desc>
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#183255" /></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f75" /></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215cce" /></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a5" /></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94601b" /></marker>
</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1440" height="100%" fill="white" />
<text x="44" y="39" fill="#087f75" font-size="17" font-weight="700" text-anchor="start">AIRSPARK / 图 A2</text>
<text x="1396" y="39" fill="#52657b" font-size="16" font-weight="400" text-anchor="end">研究设计 · v0.16.1</text>
<text x="44" y="81" fill="#183255" font-size="31" font-weight="700" text-anchor="start">从执行能力缺口到可训练经验</text>
<text x="44" y="112" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">在学院共享工具上运行的参考练习方法；经验的学习价值由后续实验检验。</text>
<path d="M44 130 H1396" fill="none" stroke="#d2dde8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<rect x="44" y="162" width="330" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7" />
<rect x="414" y="162" width="596" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7" />
<rect x="1050" y="162" width="346" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7" />
<text x="68" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">A  选择过程条件</text>
<text x="438" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">B  进入目标条件，采集专家延续</text>
<text x="1074" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">C  质检与学习</text>
<rect x="64" y="233" width="290" height="162" rx="14" fill="white" stroke="#d2dde8" stroke-width="1.7" />
<path d="M82 257 v24" stroke="#087f75" stroke-width="4" />
<text x="96" y="277" fill="#183255" font-size="22" font-weight="700" text-anchor="start">执行证据</text>
<text x="88" y="316" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">各阶段到达次数</text>
<text x="88" y="347" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">阶段转换失败统计</text>
<text x="88" y="378" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">合格经验获取成本</text>
<text x="73" y="443" fill="#087f75" font-size="22" font-weight="700" text-anchor="start">参考分配规则</text>
<text x="73" y="482" fill="#183255" font-size="21" font-weight="400" text-anchor="start">q(z) ∝ 出现频率 × 失败率</text>
<text x="130" y="514" fill="#183255" font-size="21" font-weight="400" text-anchor="start">/ 合格经验成本</text>
<text x="73" y="565" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">练习前检查：</text>
<text x="73" y="596" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• 学生输入中存在可辨识线索</text>
<text x="73" y="627" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• 物理状态实际可达</text>
<text x="73" y="658" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• 专家能够继续执行</text>
<text x="73" y="731" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">证据稀疏 → 有界探索</text>
<text x="73" y="761" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">不等于该条件风险为零</text>
<path d="M374 445 H414" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<text x="438" y="256" fill="#183255" font-size="22" font-weight="600" text-anchor="start">合法初态 → 实际执行物理前缀</text>
<path d="M454 330 H668" fill="none" stroke="#215cce" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<circle cx="454" cy="330" r="6" fill="white" stroke="#215cce" stroke-width="3" />
<circle cx="510" cy="330" r="6" fill="white" stroke="#215cce" stroke-width="3" />
<circle cx="566" cy="330" r="6" fill="white" stroke="#215cce" stroke-width="3" />
<circle cx="622" cy="330" r="6" fill="white" stroke="#215cce" stroke-width="3" />
<circle cx="668" cy="330" r="9" fill="white" stroke="#087f75" stroke-width="3" />
<text x="438" y="365" fill="#215cce" font-size="19" font-weight="400" text-anchor="start">物理前缀</text>
<text x="642" y="298" fill="#087f75" font-size="20" font-weight="600" text-anchor="start">条件 z</text>
<path d="M668 330 H956" fill="none" stroke="#94601b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 6" />
<text x="771" y="304" fill="#94601b" font-size="19" font-weight="400" text-anchor="start">观察到的失败</text>
<text x="944" y="362" fill="#94601b" font-size="31" font-weight="700" text-anchor="start">×</text>
<path d="M668 330 C718 330 736 435 812 435 H963" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<circle cx="970" cy="435" r="7" fill="white" stroke="#087f75" stroke-width="3" />
<path d="M668 330 C716 330 729 515 812 515 H963" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<circle cx="970" cy="515" r="7" fill="white" stroke="#087f75" stroke-width="3" />
<path d="M668 330 C711 330 724 595 812 595 H963" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<circle cx="970" cy="595" r="7" fill="white" stroke="#087f75" stroke-width="3" />
<text x="804" y="410" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">专家延续 1</text>
<text x="804" y="490" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">专家延续 2</text>
<text x="804" y="570" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">专家延续 k</text>
<text x="438" y="666" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">每条分支均为一次独立的物理执行。</text>
<text x="438" y="697" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">从合法初态重新执行前缀；</text>
<text x="438" y="728" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">状态快照须经恢复一致性检查后使用。</text>
<text x="438" y="759" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">专家延续成功不等于学生已经学会。</text>
<path d="M1010 445 H1050" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<rect x="1070" y="233" width="306" height="195" rx="14" fill="white" stroke="#d2dde8" stroke-width="1.7" />
<path d="M1088 257 v24" stroke="#087f75" stroke-width="4" />
<text x="1102" y="277" fill="#183255" font-size="22" font-weight="700" text-anchor="start">数据质量验收</text>
<text x="1094" y="316" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">条件命中与时序有效</text>
<text x="1094" y="347" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">专家动作来源可追溯</text>
<text x="1094" y="378" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">专家完成完整任务</text>
<text x="1094" y="409" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">记录所有未通过尝试</text>
<path d="M1223 428 V465" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<rect x="1070" y="465" width="306" height="145" rx="14" fill="#eaf6f3" stroke="#d2dde8" stroke-width="1.7" />
<path d="M1088 489 v24" stroke="#087f75" stroke-width="4" />
<text x="1102" y="509" fill="#183255" font-size="22" font-weight="700" text-anchor="start">监督数据集</text>
<text x="1094" y="548" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">前缀 → 仅作历史上下文</text>
<text x="1094" y="579" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">专家区间 → 动作监督</text>
<path d="M1223 610 V660" fill="none" stroke="#215cce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<rect x="1070" y="660" width="306" height="126" rx="14" fill="#eef4fd" stroke="#d2dde8" stroke-width="1.7" />
<path d="M1088 684 v24" stroke="#215cce" stroke-width="4" />
<text x="1102" y="704" fill="#183255" font-size="22" font-weight="700" text-anchor="start">学生策略更新</text>
<text x="1094" y="743" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">新经验 + 历史数据回放</text>
<text x="1094" y="774" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">固定训练配方</text>
<rect x="44" y="849" width="1352" height="103" rx="14" fill="#fbf7ef" stroke="#d2dde8" stroke-width="1.7" />
<text x="68" y="885" fill="#94601b" font-size="23" font-weight="700" text-anchor="start">动作监督边界</text>
<text x="356" y="885" fill="#183255" font-size="22" font-weight="400" text-anchor="start">动作监督块必须完整位于通过质检的专家控制区间内。</text>
<text x="68" y="924" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">前缀未命中、专家延续失败、复位与质检均计入采集预算。</text>
<path d="M44 981 H1396" fill="none" stroke="#d2dde8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text x="44" y="1008" fill="#52657b" font-size="16" font-weight="400" text-anchor="start">AirSpark · 面向空中操作策略自进化的模拟学院</text>
<text x="1396" y="1008" fill="#52657b" font-size="14" font-weight="400" text-anchor="end">机制示意 / 非按比例绘制</text>
</g></svg>