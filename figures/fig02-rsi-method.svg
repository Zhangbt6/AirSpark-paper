<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Feedback-driven policy self-improvement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426281"/></marker></defs><rect width="1440" height="900" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172c47}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#506781}</style>
<text x="40" y="47" class="title" text-anchor="start">Feedback-driven policy self-improvement</text>
<text x="40" y="82" class="small" text-anchor="start">Student updates and bounded plan revision use two feedback streams</text>
<rect x="40" y="120" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="155" class="head" text-anchor="start">Current student execution</text>
<text x="60" y="190" class="body" text-anchor="start">Fixed collection pool C and inputs</text>
<text x="60" y="219" class="body" text-anchor="start">Commands, motion, events, failures</text>
<text x="60" y="248" class="body" text-anchor="start">Eᵣ: current execution diagnosis</text>
<rect x="490" y="120" width="910" height="165" rx="12" fill="#e9f7f2" stroke="#adbdcf" stroke-width="1.5"/>
<text x="510" y="155" class="head" text-anchor="start">SparkMentor: bounded practice decisions</text>
<text x="510" y="190" class="body" text-anchor="start">Inputs: Eᵣ, permitted feedback/memory, current plan ηᵣ, remaining budget</text>
<text x="510" y="219" class="body" text-anchor="start">Actions: takeover event, local/full demonstration mix, preset replay</text>
<text x="510" y="248" class="body" text-anchor="start">Fixed B3 | Rule revision | Current agent | History agent</text>
<polyline points="430,201 480,201" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="385" class="head" text-anchor="start">Academy: execute practice</text>
<text x="60" y="420" class="body" text-anchor="start">Legal physical prefix → fixed expert</text>
<text x="60" y="449" class="body" text-anchor="start">Timing, action and outcome checks</text>
<text x="60" y="478" class="body" text-anchor="start">Outputs: qualified data and cost</text>
<rect x="490" y="350" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="510" y="385" class="head" text-anchor="start">Train candidate students</text>
<text x="510" y="420" class="body" text-anchor="start">Same parent state and accepted data</text>
<text x="510" y="449" class="body" text-anchor="start">Shared optimizer and training steps</text>
<text x="510" y="478" class="body" text-anchor="start">Isolate and charge every branch</text>
<rect x="940" y="350" width="460" height="165" rx="12" fill="#fff5e5" stroke="#adbdcf" stroke-width="1.5"/>
<text x="960" y="385" class="head" text-anchor="start">Development evaluation and gate</text>
<text x="960" y="420" class="body" text-anchor="start">V: full-task gains and retention</text>
<text x="960" y="449" class="body" text-anchor="start">Paired starts, fixed scoring and gate</text>
<text x="960" y="478" class="body" text-anchor="start">Fᵣ: learning feedback; no V samples</text>
<polyline points="940,285 940,317 235,317 235,340" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="430,430 480,430" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="880,430 930,430" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="580" width="840" height="155" rx="12" fill="#e9f7f2" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="615" class="head" text-anchor="start">Intervention memory Mᵣ₊₁</text>
<text x="60" y="650" class="body" text-anchor="start">Parent → plan → data → candidate → evaluation → decision → cost</text>
<text x="60" y="679" class="body" text-anchor="start">Rule and history agent share evidence; current agent sees latest F</text>
<text x="60" y="708" class="body" text-anchor="start">Rejection preserves evidence and spend for the next allowed check</text>
<rect x="940" y="580" width="460" height="155" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="960" y="615" class="head" text-anchor="start">Retained state for next round</text>
<text x="960" y="650" class="body" text-anchor="start">Accept: commit θ, training state, data, η</text>
<text x="960" y="679" class="body" text-anchor="start">Reject: keep parent and current plan</text>
<text x="960" y="708" class="body" text-anchor="start">Attempts, spend and collection RNG advance</text>
<polyline points="1170,515 1170,570" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="940,657 890,657" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="460,580 460,303 675,303 675,295" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475" y="560" class="small" text-anchor="start">Write Fᵣ and all attempts to memory</text>
<polyline points="1400,655 1420,655 1420,105 235,105 235,110" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="800" class="small" text-anchor="start">Fixed: student interface, expert, low-level control, optimizer, task weights and acceptance</text>
<text x="40" y="836" class="small" text-anchor="start">Every diagnosis, failure, branch and retest is charged; reflection text is not a learning gain</text>
<text x="40" y="872" class="small" text-anchor="start">Sealed T and final physical-real tests are outside the loop and never guide revision</text></svg>
