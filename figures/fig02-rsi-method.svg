<text x="810" y="611" font-size="23" font-weight="400" fill="#52657b" text-anchor="middle">Dᵣ</text>
<path d="M440 637 H390" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="412" y="611" font-size="24" font-weight="400" fill="#52657b" text-anchor="middle">θ′</text>
<path d="M212 520 V410" fill="none" stroke="#183255" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<text x="230" y="453" font-size="23" font-weight="400" fill="#087f75" text-anchor="start">Retained policy</text>
<text x="230" y="486" font-size="24" font-weight="600" fill="#087f75" text-anchor="start">π<tspan baseline-shift="sub" font-size="75%">θᵣ₊₁</tspan></text>
<rect x="1260" y="165" width="335" height="590" rx="7" fill="#f3f0f8" stroke="#7552a5" stroke-width="1.8"/>
<text x="1280" y="208" font-size="27" font-weight="650" fill="#183255" text-anchor="start">Intervention memory</text>
<text x="1280" y="251" font-size="28" font-weight="600" fill="#7552a5" text-anchor="start">Mᵣ → Mᵣ₊₁</text>
<text x="1280" y="327" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">Past practice plans</text>
<text x="1280" y="376" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">Datasets / model versions</text>
<text x="1280" y="425" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">Learning gains / retention</text>
<text x="1280" y="474" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">Cost / uncertainty</text>
<text x="1280" y="523" font-size="24" font-weight="400" fill="#52657b" text-anchor="start">Record every attempt</text>
<text x="1280" y="655" font-size="22" font-weight="600" fill="#7552a5" text-anchor="start">Learning feedback guides</text>
<text x="1280" y="688" font-size="22" font-weight="600" fill="#7552a5" text-anchor="start">subsequent plan revision</text>
<path d="M1260 282 H1210" fill="none" stroke="#7552a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-memory)"/>
<text x="1230" y="255" font-size="20" font-weight="400" fill="#7552a5" text-anchor="middle">History</text>
<path d="M212 755 V815 H1428 V765" fill="none" stroke="#7552a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-memory)"/>
<rect x="340" y="790" width="770" height="45" fill="white"/>
<text x="725" y="821" font-size="24" font-weight="500" fill="#7552a5" text-anchor="middle">Learning feedback Fᵣ: task gains, retention and actual cost</text>
<text x="45" y="888" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">Round r: Eᵣ and prior Mᵣ → practice Aᵣ → student update → Fᵣ stored in Mᵣ₊₁</text>
<text x="45" y="930" font-size="23" font-weight="400" fill="#52657b" text-anchor="start">Outside the learning loop: frozen student → native benchmark and physical robot; no test feedback</text>
