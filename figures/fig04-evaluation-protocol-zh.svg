<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>学院、闭环学习与外部检验</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#426281"/></marker></defs><rect width="1440" height="1000" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172c47}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#506781}</style>
<text x="40" y="46" class="title">学院、反馈学习与外部检验</text>
<g><rect x="40" y="82" width="1360" height="135" rx="12" fill="#fff5e5" stroke="#aabbd0" stroke-width="1.5"/>
<text x="62" y="117" class="head">先导：核验任务与部署合同，冻结学习协议</text>
<text x="62" y="153" class="body">柠檬＋NDT候选，一个学生后端；记录初始策略、数据与训练配置</text>
<text x="62" y="183" class="body">先导单轮与真实场景准备；后续调整轮次、独立学习链和预算</text>
</g>
<g><rect x="40" y="250" width="1360" height="145" rx="12" fill="#e9f7f2" stroke="#aabbd0" stroke-width="1.5"/>
<text x="62" y="285" class="head">E1 · 学院设施：可控练习、可靠监督与实际成本</text>
<text x="62" y="321" class="body">复用主实验日志：时序、跟踪、复位、专家产出、标签一致性与恢复</text>
<text x="62" y="351" class="body">真实场景重建与交互资产配准；原生来源对照列为可选</text>
</g>
<g><rect x="40" y="430" width="1360" height="200" rx="12" fill="#eaf3ff" stroke="#aabbd0" stroke-width="1.5"/>
<text x="62" y="465" class="head">E2 · 多轮反馈学习：完整闭环是否优于固定流程？</text>
<text x="62" y="501" class="body">主表：初始策略 ｜ 固定练习 ｜ AirSpark 完整反馈闭环</text>
<text x="62" y="531" class="body">共用设施、专家、训练配方与验收；同干预调度、资源上限和配对随机种子</text>
<text x="62" y="561" class="body">每次一个合法计划、至多一个训练候选；以独立学习链统计</text>
<text x="62" y="591" class="body">建议组件分析：无方案修订、规则修订；当前／历史反馈可选</text>
</g>
<polyline points="720,630 720,675 365,675 365,705" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="720,675 1075,675 1075,705" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="715" width="650" height="200" rx="12" fill="#eaf3ff" stroke="#aabbd0" stroke-width="1.5"/>
<text x="62" y="750" class="head">E3 · 原生 AM-Bench 跨仿真器回测</text>
<text x="62" y="786" class="body">未修改的任务、本体、动作与评分合同</text>
<text x="62" y="816" class="body">初始策略 / 固定练习 / 完整 AirSpark</text>
<text x="62" y="846" class="body">相对初始策略的变化与同预算组间差值</text>
<text x="62" y="876" class="body">合同不匹配则单列衍生设置</text>
</g>
<g><rect x="750" y="715" width="650" height="200" rx="12" fill="#fff5e5" stroke="#aabbd0" stroke-width="1.5"/>
<text x="772" y="750" class="head">E3 · Real-to-Sim-to-Real</text>
<text x="772" y="786" class="body">真实扫描、3DGS 外观与显式物理配准</text>
<text x="772" y="816" class="body">初始策略 / 基准场景练习 / 重建场景练习</text>
<text x="772" y="846" class="body">对应布局为主，预留物体／布局为可选</text>
<text x="772" y="876" class="body">不使用 Mentor 临场纠错</text>
</g>
<text x="40" y="958" class="small">封存测试与正式实机测试不向闭环回流；图示为研究设计，具体规模与结果待验证</text></svg>
