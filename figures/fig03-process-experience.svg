<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215cce"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a5"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94601b"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="100%" fill="white"/>
<text x="44" y="39" fill="#087f75" font-size="17" font-weight="700" text-anchor="start">AIRSPARK   /   FIGURE 03</text>
<text x="1396" y="39" fill="#52657b" font-size="16" font-weight="400" text-anchor="end">RESEARCH DESIGN  ·  v0.16</text>
<text x="44" y="81" fill="#183255" font-size="31" font-weight="700" text-anchor="start">From execution gaps to trainable experience</text>
<text x="44" y="112" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">A reference practice method on shared academy tools; the learning benefit remains an experimental question.</text>
<path d="M44 130 H1396" fill="none" stroke="#d2dde8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="44" y="162" width="330" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7"/>
<rect x="414" y="162" width="596" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7"/>
<rect x="1050" y="162" width="346" height="649" rx="14" fill="#f6f8fb" stroke="#d2dde8" stroke-width="1.7"/>
<text x="68" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">A  Select a condition</text>
<text x="438" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">B  Reach it, then collect continuations</text>
<text x="1074" y="204" fill="#183255" font-size="25" font-weight="700" text-anchor="start">C  Qualify &amp; learn</text>
<rect x="64" y="233" width="290" height="162" rx="14" fill="white" stroke="#d2dde8" stroke-width="1.7"/>
<path d="M82 257 v24" stroke="#087f75" stroke-width="4"/>
<text x="96" y="277" fill="#183255" font-size="22" font-weight="700" text-anchor="start">Execution evidence</text>
<text x="88" y="316" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Reached-stage counts</text>
<text x="88" y="347" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Transition failures</text>
<text x="88" y="378" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Qualified experience cost</text>
<text x="73" y="443" fill="#087f75" font-size="22" font-weight="700" text-anchor="start">Reference allocation</text>
<text x="73" y="482" fill="#183255" font-size="21" font-weight="400" text-anchor="start">q(z) ∝ frequency × failure</text>
<text x="130" y="514" fill="#183255" font-size="21" font-weight="400" text-anchor="start">/ experience cost</text>
<text x="73" y="565" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">Check before practice:</text>
<text x="73" y="596" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• student-observable cues</text>
<text x="73" y="627" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• reachable physical state</text>
<text x="73" y="658" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">• available expert continuation</text>
<text x="73" y="731" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Sparse evidence → bounded</text>
<text x="73" y="761" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">exploration, not zero risk.</text>
<path d="M374 445 H414" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<text x="438" y="256" fill="#183255" font-size="22" font-weight="600" text-anchor="start">Legal initial state → physical prefix</text>
<path d="M454 330 H668" fill="none" stroke="#215cce" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
