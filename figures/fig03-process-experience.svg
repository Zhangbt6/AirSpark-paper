<path d="M668 330 C716 330 729 515 812 515 H963" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<circle cx="970" cy="515" r="7" fill="white" stroke="#087f75" stroke-width="3"/>
<path d="M668 330 C711 330 724 595 812 595 H963" fill="none" stroke="#087f75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<circle cx="970" cy="595" r="7" fill="white" stroke="#087f75" stroke-width="3"/>
<text x="804" y="410" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">Expert continuation 1</text>
<text x="804" y="490" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">Expert continuation 2</text>
<text x="804" y="570" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">Expert continuation k</text>
<text x="438" y="666" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Each branch is a separate physical rollout.</text>
<text x="438" y="697" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Re-execute the prefix from a valid initial state;</text>
<text x="438" y="728" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">use snapshots only after restoration checks.</text>
<text x="438" y="759" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">Successful continuation is not proof of learning.</text>
<path d="M1010 445 H1050" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
