<text x="1102" y="509" fill="#183255" font-size="22" font-weight="700" text-anchor="start">Supervised dataset</text>
<text x="1094" y="548" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Prefix → history only</text>
<text x="1094" y="579" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Expert → action targets</text>
<path d="M1223 610 V660" fill="none" stroke="#215cce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="1070" y="660" width="306" height="126" rx="14" fill="#eef4fd" stroke="#d2dde8" stroke-width="1.7"/>
<path d="M1088 684 v24" stroke="#215cce" stroke-width="4"/>
<text x="1102" y="704" fill="#183255" font-size="22" font-weight="700" text-anchor="start">Student update</text>
<text x="1094" y="743" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">New experience + replay</text>
<text x="1094" y="774" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Fixed training recipe</text>
<rect x="44" y="849" width="1352" height="103" rx="14" fill="#fbf7ef" stroke="#d2dde8" stroke-width="1.7"/>
<text x="68" y="885" fill="#94601b" font-size="23" font-weight="700" text-anchor="start">Supervision boundary</text>
<text x="356" y="885" fill="#183255" font-size="22" font-weight="400" text-anchor="start">Expert action chunks must stay within the accepted expert-control interval.</text>
<text x="68" y="924" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Count prefix misses, failed continuations, reset and quality checks in the collection budget.</text>
