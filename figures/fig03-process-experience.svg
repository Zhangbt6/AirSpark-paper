<path d="M1088 257 v24" stroke="#087f75" stroke-width="4"/>
<text x="1102" y="277" fill="#183255" font-size="22" font-weight="700" text-anchor="start">Quality gate</text>
<text x="1094" y="316" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Condition hit + valid timing</text>
<text x="1094" y="347" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Expert action provenance</text>
<text x="1094" y="378" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Complete expert success</text>
<text x="1094" y="409" fill="#52657b" font-size="22" font-weight="400" text-anchor="start">Log rejected attempts</text>
<path d="M1223 428 V465" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<rect x="1070" y="465" width="306" height="145" rx="14" fill="#eaf6f3" stroke="#d2dde8" stroke-width="1.7"/>
