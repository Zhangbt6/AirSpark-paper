<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>Experimental design and independent evaluation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#183255"/></marker></defs><rect width="1440" height="1000" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#183255">
