<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>反馈驱动的策略自进化方法</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426281"/></marker></defs><rect width="1440" height="900" fill="white"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172c47}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#506781}</style>
<text x="40" y="47" class="title" text-anchor="start">反馈驱动的策略自进化</text>
<text x="40" y="82" class="small" text-anchor="start">学生参数更新与有界练习计划修订；两种反馈进入同一闭环</text>
<rect x="40" y="120" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="155" class="head" text-anchor="start">当前学生执行</text>
<text x="60" y="190" class="body" text-anchor="start">固定采集池 C 与部署输入</text>
<text x="60" y="219" class="body" text-anchor="start">命令、运动、阶段事件与失败</text>
<text x="60" y="248" class="body" text-anchor="start">Eᵣ：当前执行诊断</text>
<rect x="490" y="120" width="910" height="165" rx="12" fill="#e9f7f2" stroke="#adbdcf" stroke-width="1.5"/>
<text x="510" y="155" class="head" text-anchor="start">SparkMentor · 有界练习决策</text>
<text x="510" y="190" class="body" text-anchor="start">输入：Eᵣ、允许的学习反馈／记忆、当前方案 ηᵣ 与剩余预算</text>
<text x="510" y="219" class="body" text-anchor="start">动作：监督起点、局部／完整经验构成、预设回放选项</text>
<text x="510" y="248" class="body" text-anchor="start">固定 B3 ｜规则修订｜当前反馈 Agent｜历史反馈 Agent</text>
<polyline points="430,201 480,201" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="385" class="head" text-anchor="start">学院：实际经验生成</text>
<text x="60" y="420" class="body" text-anchor="start">合法物理前缀 → 固定专家延续</text>
<text x="60" y="449" class="body" text-anchor="start">时间／动作／完整终态质检</text>
<text x="60" y="478" class="body" text-anchor="start">输出：合格数据与实际成本</text>
<rect x="490" y="350" width="390" height="165" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="510" y="385" class="head" text-anchor="start">候选学生训练</text>
<text x="510" y="420" class="body" text-anchor="start">同一父状态与已接纳数据</text>
<text x="510" y="449" class="body" text-anchor="start">共享优化算法与候选步数</text>
<text x="510" y="478" class="body" text-anchor="start">候选分支隔离并全部计费</text>
<rect x="940" y="350" width="460" height="165" rx="12" fill="#fff5e5" stroke="#adbdcf" stroke-width="1.5"/>
<text x="960" y="385" class="head" text-anchor="start">开发评价与接纳</text>
<text x="960" y="420" class="body" text-anchor="start">V：完整任务收益、能力保留</text>
<text x="960" y="449" class="body" text-anchor="start">配对初态、固定评分与经验门槛</text>
<text x="960" y="478" class="body" text-anchor="start">Fᵣ：学习反馈，不回流 V 训练样本</text>
<polyline points="940,285 940,317 235,317 235,340" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="430,430 480,430" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="880,430 930,430" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="580" width="840" height="155" rx="12" fill="#e9f7f2" stroke="#adbdcf" stroke-width="1.5"/>
<text x="60" y="615" class="head" text-anchor="start">跨轮干预记忆 Mᵣ₊₁</text>
<text x="60" y="650" class="body" text-anchor="start">父代 → 方案 → 数据 → 候选 → 评价 → 接纳／拒绝 → 成本</text>
<text x="60" y="679" class="body" text-anchor="start">规则组与历史 Agent 同证据；当前组仅最近一次 F</text>
<text x="60" y="708" class="body" text-anchor="start">拒绝仍保留失败证据与支出；下次检查可提出新方案</text>
<rect x="940" y="580" width="460" height="155" rx="12" fill="#eaf3ff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="960" y="615" class="head" text-anchor="start">下一轮保留状态</text>
<text x="960" y="650" class="body" text-anchor="start">接纳：提交 θ、训练状态、数据和 η</text>
<text x="960" y="679" class="body" text-anchor="start">拒绝：保留父代与当前方案</text>
<text x="960" y="708" class="body" text-anchor="start">尝试轮次、成本与采集随机流推进</text>
<polyline points="1170,515 1170,570" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="940,657 890,657" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="460,580 460,303 675,303 675,295" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475" y="560" class="small" text-anchor="start">Fᵣ 与全部尝试写入记忆</text>
<polyline points="1400,655 1420,655 1420,105 235,105 235,110" fill="none" stroke="#426281" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="800" class="small" text-anchor="start">固定约束：学生接口、专家、低层控制、优化算法、任务权重与验收标准</text>
<text x="40" y="836" class="small" text-anchor="start">所有诊断、失败、候选训练与复验计入相同资源上限；反思文本不等于学习收益</text>
<text x="40" y="872" class="small" text-anchor="start">封存测试 T 与真实最终测试在闭环外执行，反馈不得进入修订决策</text></svg>
