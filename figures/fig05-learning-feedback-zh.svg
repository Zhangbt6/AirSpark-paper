<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">学习过程的闭环反馈表述</title><desc id="desc">能力目标用于报告和预定检查；基础组的任务预算与分配规则固定。</desc><defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#183255"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f75"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7552a5"/></marker>
</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1440" height="810" fill="white"/>
<text x="44" y="46" fill="#183255" font-size="29" font-weight="700" text-anchor="start">学习过程的闭环反馈表述</text>
<text x="44" y="83" fill="#52657b" font-size="21" font-weight="400" text-anchor="start">固定目标、能力测量、有限干预与更新验证。</text>
<rect x="44" y="150" width="270" height="180" rx="5" fill="#eef4fd" stroke="#215cce" stroke-width="1.7"/>
<text x="62" y="187" fill="#183255" font-size="23" font-weight="600" text-anchor="start">目标与评价协议</text>
<text x="62" y="225" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">能力报告目标 c*</text>
<text x="62" y="256" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">固定任务分组与能力保留</text>
<text x="62" y="287" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">固定任务组预算</text>
<rect x="374" y="150" width="290" height="180" rx="5" fill="#eaf6f3" stroke="#087f75" stroke-width="1.7"/>
<text x="392" y="187" fill="#183255" font-size="23" font-weight="600" text-anchor="start">SparkMentor  μ</text>
<text x="392" y="225" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">执行证据 Eᵣ 与学习反馈 Fᵣ</text>
<text x="392" y="256" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">跨轮干预记忆 Mᵣ</text>
<text x="392" y="287" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">选择练习计划 Aᵣ</text>
<rect x="724" y="150" width="672" height="225" rx="5" fill="#f7f9fc" stroke="#d2dde8" stroke-width="1.7"/>
<text x="742" y="187" fill="#183255" font-size="23" font-weight="600" text-anchor="start">学院执行与学生学习 U</text>
<text x="742" y="225" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">物理前缀 → 专家经验 → 质量检查</text>
<text x="742" y="256" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">训练学生：xᵣ → 候选状态 x′ᵣ₊₁</text>
<text x="742" y="287" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">ACT / DP / VLA；部署接口固定</text>
<text x="742" y="318" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">实际执行，包含采样与优化的随机性</text>
<path d="M314 235H374" fill="none" stroke="#183255" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ink)"/>
<path d="M664 235H724" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<text x="694" y="218" fill="#087f75" font-size="20" font-weight="500" text-anchor="middle">Aᵣ</text>
<rect x="44" y="475" width="350" height="175" rx="5" fill="#f1eef8" stroke="#7552a5" stroke-width="1.7"/>
<text x="62" y="512" fill="#183255" font-size="23" font-weight="600" text-anchor="start">反馈与版本记忆</text>
<text x="62" y="550" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">Eᵣ：当前执行证据（采集池 C）</text>
<text x="62" y="581" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">Fᵣ：学习后的变化（开发池 V）</text>
<text x="62" y="612" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">干预方案、结果与成本</text>
<rect x="520" y="475" width="350" height="175" rx="5" fill="#f7f9fc" stroke="#d2dde8" stroke-width="1.7"/>
<text x="538" y="512" fill="#183255" font-size="23" font-weight="600" text-anchor="start">比较与接纳</text>
<text x="538" y="550" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">候选与父模型比较</text>
<text x="538" y="581" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">验收更新或保留当前学生</text>
<text x="538" y="612" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">预先规定停止条件</text>
<rect x="970" y="475" width="426" height="175" rx="5" fill="#eef4fd" stroke="#215cce" stroke-width="1.7"/>
<text x="988" y="512" fill="#183255" font-size="23" font-weight="600" text-anchor="start">开发测量 Hᵥ</text>
<text x="988" y="550" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">固定任务与评分协议</text>
<text x="988" y="581" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">能力估计与不确定性</text>
<text x="988" y="612" fill="#52657b" font-size="19" font-weight="400" text-anchor="start">完整任务收益、能力保留与成本</text>
<path d="M1183 375V475" fill="none" stroke="#183255" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ink)"/>
<path d="M970 560H870" fill="none" stroke="#183255" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ink)"/>
<text x="920" y="540" fill="#52657b" font-size="16" font-weight="400" text-anchor="middle">实测响应</text>
<path d="M520 560H394" fill="none" stroke="#7552a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<text x="457" y="540" fill="#7552a5" font-size="16" font-weight="400" text-anchor="middle">Fᵣ 与接纳结果</text>
<path d="M219 475V405H519V330" fill="none" stroke="#7552a5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<text x="300" y="394" fill="#7552a5" font-size="19" font-weight="400" text-anchor="start">反馈与记忆</text>
<path d="M695 475V420H900V375" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<text x="730" y="409" fill="#087f75" font-size="18" font-weight="400" text-anchor="start">下一轮学习状态</text>
<text x="44" y="693" fill="#52657b" font-size="20" font-weight="400" text-anchor="start">U 是实际学习过程；H 是执行后的测量，未引入学习收益预测器。</text>
<rect x="44" y="722" width="1352" height="48" rx="5" fill="#f7f9fc" stroke="#d2dde8" stroke-width="1.7"/>
<text x="62" y="753" fill="#183255" font-size="20" font-weight="400" text-anchor="start">封存测试 T：冻结学生 → 原生基准与真实任务；结果不回流当前闭环。</text>
<text x="44" y="799" fill="#52657b" font-size="16" font-weight="400" text-anchor="start">能力目标用于报告和预定检查；基础组的任务预算与分配规则固定。</text>
</g></svg>